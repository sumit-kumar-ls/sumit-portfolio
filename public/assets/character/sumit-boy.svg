<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" fill="none">
  <defs>
    <!-- Skin Tone Gradients (Youthful & Warm) -->
    <radialGradient id="skinBase" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stopColor="#FFF0E5" />
      <stop offset="65%" stopColor="#F7D3BC" />
      <stop offset="100%" stopColor="#EAB396" />
    </radialGradient>

    <!-- Hair Gradient (Clean Modern Dark Textured Hair) -->
    <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#362921" />
      <stop offset="60%" stopColor="#221914" />
      <stop offset="100%" stopColor="#120D0A" />
    </linearGradient>

    <!-- Hoodie / Clothing Gradients (Muted Olive & Soft Beige) -->
    <linearGradient id="oliveHoodie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#5E7343" />
      <stop offset="50%" stopColor="#4A5D2E" />
      <stop offset="100%" stopColor="#354420" />
    </linearGradient>

    <linearGradient id="hoodieHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#738954" stop-opacity="0.7" />
      <stop offset="100%" stopColor="#4A5D2E" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="creamInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#FAF8F3" />
      <stop offset="100%" stopColor="#EAE3D2" />
    </linearGradient>

    <linearGradient id="slimPants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#2E3440" />
      <stop offset="100%" stopColor="#1E222A" />
    </linearGradient>

    <linearGradient id="sneakerWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#E2E8F0" />
    </linearGradient>

    <!-- Laptop Prop Gradient -->
    <linearGradient id="laptopBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#E2E8F0" />
      <stop offset="100%" stopColor="#94A3B8" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2C2B29" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Ground Soft Shadow Oval -->
  <ellipse cx="200" cy="480" rx="100" ry="16" fill="#3A3226" opacity="0.12" />
  <ellipse cx="200" cy="480" rx="65" ry="9" fill="#3A3226" opacity="0.2" />

  <!-- Character Group -->
  <g filter="url(#softShadow)">
    
    {/* Slimmer Youthful Legs & Pants */}
    <rect x="162" y="350" width="30" height="105" rx="15" fill="url(#slimPants)" />
    <rect x="208" y="350" width="30" height="105" rx="15" fill="url(#slimPants)" />

    {/* Clean White Sneakers */}
    <path d="M 152 445 Q 160 436 188 436 L 196 456 Q 182 463 152 458 Z" fill="url(#sneakerWhite)" />
    <path d="M 248 445 Q 240 436 212 436 L 204 456 Q 218 463 248 458 Z" fill="url(#sneakerWhite)" />
    <rect x="150" y="455" width="46" height="7" rx="3.5" fill="#4A5D2E" />
    <rect x="204" y="455" width="46" height="7" rx="3.5" fill="#4A5D2E" />

    {/* Upper Body: Layered Cream T-shirt & Muted Olive Hoodie */}
    {/* Base Hoodie Body */}
    <path
      d="M 136 210 C 136 190, 264 190, 264 210 L 274 355 C 274 365, 126 365, 126 355 Z"
      fill="url(#oliveHoodie)"
    />
    
    {/* Hoodie Upper Highlight */}
    <path
      d="M 136 210 C 155 195, 245 195, 264 210 L 258 285 C 195 295, 160 285, 138 285 Z"
      fill="url(#hoodieHighlight)"
    />

    {/* Inner Cream Tee V-Neck Peek */}
    <path d="M 182 208 L 200 235 L 218 208 Z" fill="url(#creamInner)" />

    {/* Hoodie Strings */}
    <path d="M 188 215 Q 185 248 189 265" stroke="#FAF8F3" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 212 215 Q 215 248 211 265" stroke="#FAF8F3" stroke-width="2.5" stroke-linecap="round" />

    {/* Arms & Sleek Laptop Prop */}
    {/* Left Arm holding laptop */}
    <path d="M 132 215 Q 108 275 142 305" stroke="url(#oliveHoodie)" stroke-width="28" stroke-linecap="round" />
    
    {/* Right Arm relaxed at side */}
    <path d="M 268 215 Q 292 275 262 305" stroke="url(#oliveHoodie)" stroke-width="28" stroke-linecap="round" />

    {/* Sleek Laptop Prop */}
    <g transform="rotate(-10 155 290)">
      <rect x="115" y="280" width="70" height="48" rx="5" fill="url(#laptopBody)" stroke="#CBD5E1" stroke-width="1.2" />
      <rect x="119" y="284" width="62" height="40" rx="3.5" fill="#1E293B" />
      {/* Code / Developer Green Accent Dot */}
      <circle cx="150" cy="304" r="7" fill="#4A5D2E" />
      <path d="M 146.5 304 L 149 306.5 L 153.5 301.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
    </g>

    {/* Hands Skin Tone */}
    <circle cx="138" cy="305" r="11" fill="url(#skinBase)" />
    <circle cx="262" cy="305" r="11" fill="url(#skinBase)" />

    {/* Neck */}
    <rect x="186" y="174" width="28" height="26" rx="9" fill="url(#skinBase)" />

    {/* Head - Youthful College Student Proportions */}
    <circle cx="200" cy="142" r="44" fill="url(#skinBase)" />

    {/* Ears */}
    <circle cx="155" cy="144" r="9" fill="url(#skinBase)" />
    <circle cx="245" cy="144" r="9" fill="url(#skinBase)" />

    {/* Modern Clean Hair (No moustache, no beard, no glasses!) */}
    <path
      d="M 153 140 C 148 95, 252 95, 247 140 C 242 112, 222 102, 200 102 C 178 102, 158 112, 153 140 Z"
      fill="url(#hairGrad)"
    />
    {/* Hair Top Layer Volume & Side Fade */}
    <path
      d="M 160 126 Q 185 106 210 114 Q 232 108 241 123 Q 220 116 200 118 Q 180 116 160 126 Z"
      fill="url(#hairGrad)"
    />
    <path
      d="M 166 122 Q 190 110 214 116 Z"
      stroke="#523E32" stroke-width="2" stroke-linecap="round" opacity="0.6"
    />

    {/* Youthful Clean Face: Expressive Bright Eyes, Soft Eyebrows, Confident Smile */}
    {/* Eyebrows (Neat & Clean) */}
    <path d="M 172 130 Q 182 126 190 130" stroke="#362921" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 210 130 Q 218 126 228 130" stroke="#362921" stroke-width="2.5" stroke-linecap="round" fill="none" />

    {/* Eyes (Bright, Friendly, Warm) */}
    <ellipse cx="181" cy="139" rx="5" ry="5.5" fill="#1C1814" />
    <ellipse cx="219" cy="139" rx="5" ry="5.5" fill="#1C1814" />
    
    {/* Eye Highlights */}
    <circle cx="182.5" cy="137.5" r="1.8" fill="#FFFFFF" />
    <circle cx="220.5" cy="137.5" r="1.8" fill="#FFFFFF" />
    <circle cx="179.5" cy="141" r="0.9" fill="#FFFFFF" opacity="0.8" />
    <circle cx="217.5" cy="141" r="0.9" fill="#FFFFFF" opacity="0.8" />

    {/* Soft Youthful Nose */}
    <path d="M 198 144 Q 200 149 202 144" stroke="#D89A7A" stroke-width="2" stroke-linecap="round" fill="none" />

    {/* Confident Friendly Smile (Clean - No Beard, No Moustache) */}
    <path d="M 188 156 Q 200 166 212 156" stroke="#C86D51" stroke-width="2.8" stroke-linecap="round" fill="none" />

    {/* Soft Rosy Cheeks */}
    <circle cx="168" cy="148" r="6" fill="#E89A84" opacity="0.35" />
    <circle cx="232" cy="148" r="6" fill="#E89A84" opacity="0.35" />
  </g>
</svg>
